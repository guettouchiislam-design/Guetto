<style>
:root{
  --bg:#14171a; --panel:#1f242b; --panel-raised:#262c34; --text:#eef1f0;
  --muted:#8b95a1; --line:#333b44; --amber:#ff8c32; --amber-dim:#5c3d1e;
  --teal:#34d1a4; --teal-dim:#1c4438; --lcd-bg:#0b0f0d;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Tahoma,'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(40px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent;}
.wrap{max-width:460px;margin:0 auto;}
header{text-align:center;padding:14px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:14px;position:relative;}
header .eyebrow{font-family:Consolas,monospace;letter-spacing:2px;font-size:11px;color:var(--amber);}
header h1{font-size:19px;margin:6px 0 2px;}
header .sub{font-size:12px;color:var(--muted);}
.langSwitch{position:absolute;top:0;left:0;display:flex;gap:4px;}
.langSwitch button{padding:5px 8px;font-size:11px;border-radius:6px;border:1px solid var(--line);background:var(--panel-raised);color:var(--muted);font-family:inherit;}
.langSwitch button.active{border-color:var(--amber);color:var(--amber);}
.topTabs{display:flex;flex-wrap:wrap;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px;margin-bottom:12px;}
.topTabs button{flex:1 1 30%;min-width:64px;padding:9px 4px;border:none;border-radius:8px;background:transparent;color:var(--muted);font-size:12px;font-weight:bold;font-family:inherit;}
.topTabs button.active{background:var(--amber);color:#1a1204;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 14px 16px;margin-bottom:12px;}
.card .cardTitle{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:10px;}
label{display:block;font-size:14px;margin-bottom:6px;}
label .req{color:var(--amber);}
label .opt{color:var(--muted);font-size:11px;font-weight:normal;}
select, input[type=number]{width:100%;background:var(--panel-raised);border:1px solid var(--line);color:var(--text);padding:11px 10px;border-radius:8px;font-size:15px;font-family:inherit;margin-bottom:14px;}
select:focus, input:focus{outline:2px solid var(--amber);}
.row2{display:flex;gap:10px;}
.row2 > div{flex:1;}
.segSwitch{display:flex;gap:8px;margin-bottom:14px;}
.segSwitch button{flex:1;padding:10px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel-raised);color:var(--muted);font-family:inherit;font-size:13.5px;}
.segSwitch button.active{border-color:var(--amber);color:var(--amber);background:var(--amber-dim);}
.optionalToggle{font-size:12.5px;color:var(--teal);margin-bottom:10px;display:inline-block;cursor:pointer;}
.dro{background:var(--lcd-bg);border:1px solid var(--line);border-radius:12px;padding:16px 14px;margin-top:6px;}
.dro .droHead{font-family:Consolas,monospace;font-size:11px;color:var(--muted);letter-spacing:2px;text-align:center;margin-bottom:12px;}
.droGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.droCell{background:#0e1310;border:1px solid #202826;border-radius:8px;padding:10px 8px;text-align:center;}
.droCell .k{font-family:Consolas,monospace;font-size:11px;color:var(--amber);letter-spacing:1px;}
.droCell .v{font-family:Consolas,monospace;font-size:20px;font-weight:bold;color:#eafff5;margin:4px 0 2px;font-variant-numeric:tabular-nums;}
.droCell .u{font-size:11px;color:var(--muted);}
.note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);}
.note b{color:var(--text);}
.warnBox{background:var(--amber-dim);border:1px solid var(--amber);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px;color:#ffd9ae;}
.resultTable{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
.resultTable td{padding:6px 4px;border-bottom:1px solid var(--line);}
.resultTable td.k{color:var(--muted);}
.resultTable td.v{text-align:right;font-family:Consolas,monospace;color:var(--text);font-weight:bold;}
.infoCard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center;}
.infoCard .dev{font-size:17px;font-weight:bold;color:var(--amber);margin-top:10px;}
.infoCard p{color:var(--muted);font-size:13px;line-height:1.7;}
</style>
</head>

const PLANFRAESEN_AP_INTERNET = { schruppen:[2,5], schlichten:[0.2,1], src:'Internet (Uddeholm/jlccnc/richconn Face-Milling-Richtwerte), nicht Tabellenbuch Metall' };

const WERKZEUGMATERIAL_OPTIONS = ['Hartmetall','HSS beschichtet','HSS unbeschichtet'];
// Welche Bearbeitungsarten passen zu welchem Werkzeugmaterial:
function artsForMaterial(mat){
  if(mat==='Hartmetall') return ['eckplan90','planAllg','kontur'];
  return ['walzenstirn','kontur']; // HSS beschichtet/unbeschichtet
}
function werkzeugtypFor(art, mat){
  if(art==='eckplan90') return 'HM-Wendeschneidplatten (90°-Eckfräser)';
  if(art==='planAllg') return 'HM-Wendeschneidplatten (Igelfräser)';
  if(art==='walzenstirn') return 'HSS-Walzenstirnfräser';
  if(art==='kontur') return mat==='Hartmetall' ? 'VHM-Schaftfräser' : 'HSS-Schaftfräser';
}

function calcFraesen(){
  const mat = fraesenSel.material, art = fraesenSel.art;
  const D = art==='kontur' ? fraesenSel.konturD : fraesenSel.D;
  const z = fraesenSel.z;
  let vc, fz, apInfo=null, aeInfo=null;

  if(art==='eckplan90'||art==='planAllg'){
    const row = FRAESEN_TABLES[art].rows[fraesenSel.matIdx];
    vc = low(row.vc);
    fz = low(fraesenSel.mode==='schruppen'?row.fzA:row.fzB);
    const aeRange = FRAESEN_TABLES[art].aeModes; // informational only
    aeInfo = fraesenSel.mode==='schruppen' ? {text: art==='eckplan90'?'(0,5…1,0)·d':'(0,4…0,3)·d', src:'Tabellenbuch'} : {text:'0,1·d', src:'Tabellenbuch'};
    const apR = PLANFRAESEN_AP_INTERNET[fraesenSel.mode];
    apInfo = {value: low(apR), src: PLANFRAESEN_AP_INTERNET.src, internet:true};
  } else if(art==='walzenstirn'){
    const row = WALZENSTIRN_TABLE.rows[fraesenSel.matIdx];
    const coatKey = mat==='HSS unbeschichtet' ? 'unb' : 'besch';
    const base = row[coatKey];
    if(!base){ $('resultBox').innerHTML = `<div class="warnBox">${t('notSupported')}</div>`; return; }
    vc = low(base);
    fz = low(WALZENSTIRN_TABLE.fz[coatKey==='unb'?'unbeschichtet':'beschichtet']);
    if(fraesenSel.mode==='schruppen'){ apInfo={value:0.2*D, src:'Tabellenbuch Metall S.360 (ap=0,2·d)'}; aeInfo={text:'0,75·d', src:'Tabellenbuch'}; }
    else { apInfo={notAvailable:true}; aeInfo={notAvailable:true}; fz = fz*0.9; }
  } else { // kontur
    const dataset = mat==='Hartmetall' ? KONTUR_VHM : KONTUR_HSS;
    const row = dataset.rows[fraesenSel.matIdx];
    const colIdx = nearestCol(KONTUR_DCOLS, D);
    const vcBase = fraesenSel.mode==='schruppen'? row.vcS : row.vcF;
    const fzBase = fraesenSel.mode==='schruppen'? row.fzS : row.fzF;
    const unbeschichtet = mat==='HSS unbeschichtet';
    vc = low(vcBase) * (unbeschichtet? dataset.korrekturUnbeschichtet : 1);
    fz = fzBase[colIdx];
    if(mat==='Hartmetall'){ // VHM
      apInfo = fraesenSel.mode==='schruppen' ? {value:1.0*D, src:'Tabellenbuch Metall S.363 (ap=1,0·d)'} : {value:1.5*D, src:'Tabellenbuch Metall S.363 (ap=1,5·d)'};
    } else {
      apInfo = {value:1.0*D, src:'Tabellenbuch Metall S.361 (ap=1,0·d)'};
    }
    aeInfo = fraesenSel.mode==='schruppen' ? {text:'0,5·d', src:'Tabellenbuch'} : {text:'0,1·d', src:'Tabellenbuch'};
  }

  const n = (vc*1000)/(Math.PI*D);
  const vf = n*fz*z;
  let html = `<div class="dro"><div class="droHead">${t('n')} / ${t('vc')} / ${t('vf')}</div><div class="droGrid">
    <div class="droCell"><div class="k">n</div><div class="v">${fmt(n,0)}</div><div class="u">1/min</div></div>
    <div class="droCell"><div class="k">vf</div><div class="v">${fmt(vf,0)}</div><div class="u">mm/min</div></div>
    <div class="droCell"><div class="k">vc</div><div class="v">${fmt(vc,1)}</div><div class="u">m/min</div></div>
    <div class="droCell"><div class="k">fz</div><div class="v">${fmt(fz,3)}</div><div class="u">mm</div></div>
  </div>
  <div class="droGrid" style="margin-top:10px;">
    <div class="droCell">
      <div class="k">ap</div>
      ${apInfo && apInfo.notAvailable ? `<div class="v" style="font-size:12px;">${t('notSupported')}</div>` : `<div class="v">${fmt(apInfo.value,2)}</div><div class="u">mm</div>`}
    </div>
    <div class="droCell">
      <div class="k">aₑ</div>
      ${aeInfo && aeInfo.notAvailable ? `<div class="v" style="font-size:12px;">${t('notSupported')}</div>` : `<div class="v" style="font-size:16px;">${aeInfo.text}</div>`}
    </div>
  </div></div>`;
  if(apInfo && apInfo.internet) html += `<div class="warnBox">ap-Wert aus Internetrecherche (${apInfo.src}) — nicht aus Tabellenbuch Metall, da dort für diese Bearbeitungsart kein ap angegeben ist.</div>`;
  $('resultBox').innerHTML = html;
}

function calcDrehen(){
  const table = drehenSel.tool==='HM' ? DREHEN_TABLE_HM : DREHEN_TABLE_HSS;
  const row = table.rows[drehenSel.matIdx];
  const D = drehenSel.D;
  const modeKey = drehenSel.mode==='schruppen' ? 'schrupp' : 'schlicht';
  let vcArr, apR, fR;
  if(drehenSel.art==='quer'){ vcArr = row.quer; apR = DREHEN_AP.quer; fR = DREHEN_F.quer; }
  else if(drehenSel.art==='innen' || drehenSel.art==='laengs'){ vcArr = row[modeKey]; apR = DREHEN_AP[modeKey]; fR = DREHEN_F[modeKey]; }
  else if(drehenSel.art==='einstech'){
    vcArr = drehenSel.tool==='HM'? row.abstech : row.einstech;
    apR = drehenSel.tool==='HM'? DREHEN_AP_HM.abstech : DREHEN_AP.einstech;
    fR = drehenSel.tool==='HM'? DREHEN_F_HM.abstech : DREHEN_F.einstech;
  } else if(drehenSel.art==='gewindedrehen'){
    vcArr = drehenSel.tool==='HM'? row.gewinde : null;
    apR = null; fR = null;
  }
  if(!vcArr){ $('resultBox').innerHTML = `<div class="warnBox">${t('notSupported')}</div>`; return; }
  const vc = low(vcArr);
  const n = (vc*1000)/(Math.PI*D);
  $('resultBox').innerHTML = `<div class="dro"><div class="droHead">${t('n')} / ${t('vc')}</div><div class="droGrid">
    <div class="droCell"><div class="k">n</div><div class="v">${fmt(n,0)}</div><div class="u">1/min</div></div>
    <div class="droCell"><div class="k">vc</div><div class="v">${fmt(vc,0)}</div><div class="u">m/min</div></div>
    ${apR?`<div class="droCell"><div class="k">ap</div><div class="v">${apR.join('…')}</div><div class="u">mm</div></div>`:''}
    ${fR?`<div class="droCell"><div class="k">f</div><div class="v">${fR.join('…')}</div><div class="u">mm/U</div></div>`:''}
  </div></div>`;
}

/* ---------- BOHREN ---------- */
let bohrenSel = { art:'spiral', matIdx:0, tool:'HSS', coating:'beschichtet', D:10 };
function viewBohren(){
  const table = BOHREN_TABLES[bohrenSel.art];
  let materialField = '';
  if(table.mode==='family-coating'){
    materialField = `<label>${t('werkzeugmaterial')} <span class="req">${t('required')}</span></label>
    <div class="segSwitch">
      <button data-tool="HSS" class="${bohrenSel.tool==='HSS'?'active':''}">${table.toolLabel.HSS}</button>
      <button data-tool="HM" class="${bohrenSel.tool==='HM'?'active':''}">${table.toolLabel.HM}</button>
    </div>
    <div class="segSwitch">
      <button data-coating="beschichtet" class="${bohrenSel.coating==='beschichtet'?'active':''}">beschichtet</button>
      <button data-coating="unbeschichtet" class="${bohrenSel.coating==='unbeschichtet'?'active':''}">unbeschichtet (×0,7)</button>
    </div>`;
  } else if(table.mode==='coating-only'){
    materialField = `<label>${t('werkzeugmaterial')} <span class="req">${t('required')}</span></label>
    <select disabled><option>${table.fixedFamily}</option></select>
    <div class="segSwitch">
      <button data-coating="unbeschichtet" class="${bohrenSel.coating==='unbeschichtet'?'active':''}">unbeschichtet</button>
      <button data-coating="beschichtet" class="${bohrenSel.coating==='beschichtet'?'active':''}">beschichtet</button>
    </div>`;
  } else { // family-only
    materialField = `<label>${t('werkzeugmaterial')} <span class="req">${t('required')}</span></label>
    <div class="segSwitch">
      <button data-tool="HSS" class="${bohrenSel.tool==='HSS'?'active':''}">${table.toolLabel.HSS}</button>
      <button data-tool="HM" class="${bohrenSel.tool==='HM'?'active':''}">${table.toolLabel.HM}</button>
    </div>`;
  }
  return `<div class="card">
    <div class="cardTitle">${t('tabs').bohren} — ${table.src}</div>
    <label>${t('werkstoff')} <span class="req">${t('required')}</span></label>
    <select id="matSel">${table.rows.map((r,i)=>`<option value="${i}" ${i==bohrenSel.matIdx?'selected':''}>${matName(r.g)} (${condName(r.c)})</option>`).join('')}</select>
    <label>${t('bohrverfahren')} <span class="req">${t('required')}</span></label>
    <select id="artSel">
      <option value="spiral" ${bohrenSel.art==='spiral'?'selected':''}>${t('spiral')}</option>
      <option value="anbohren" ${bohrenSel.art==='anbohren'?'selected':''}>${t('anbohren')}</option>
      <option value="tiefloch" ${bohrenSel.art==='tiefloch'?'selected':''}>${t('tiefloch')}</option>
      <option value="reiben" ${bohrenSel.art==='reiben'?'selected':''}>${t('reiben')}</option>
      <option value="kegelsenken" ${bohrenSel.art==='kegelsenken'?'selected':''}>${t('kegelsenken')}</option>
    </select>
    ${materialField}
    <label>${t('bohrerDurchmesser')} <span class="req">${t('required')}</span></label>
    <input type="number" id="dIn" value="${bohrenSel.D}" min="0.1" step="0.1">
  </div>
  <div id="resultBox"></div>
  <div class="note"><b>${t('dataSource')}:</b> ${table.src}.${table.mode==='family-coating'?' "unbeschichtet" = 70% von vc (Fußnote S.370).':''}${table.mode==='family-only'?' Beide Spalten sind bereits unbeschichtet — keine beschichtete Variante in der Quelle.':''}</div>`;
}
function nearestCol(dCols, D){ let idx=0,best=Infinity; dCols.forEach((c,i)=>{const d=Math.abs(c-D); if(d<best){best=d;idx=i;}}); return idx; }
function calcBohren(){
  const table = BOHREN_TABLES[bohrenSel.art];
  const row = table.rows[bohrenSel.matIdx];
  const D = bohrenSel.D;
  let vc;
  if(table.mode==='family-coating'){
    const base = bohrenSel.tool==='HM'? row.vcHM : row.vcHSS;
    if(!base){ $('resultBox').innerHTML = `<div class="warnBox">${t('notSupported')}</div>`; return; }
    vc = low(base) * (bohrenSel.coating==='unbeschichtet'? UNBESCHICHTET_FAKTOR : 1);
  } else if(table.mode==='coating-only'){
    const base = bohrenSel.coating==='unbeschichtet'? row.vcUnb : row.vcBesch;
    vc = low(base);
  } else {
    const base = bohrenSel.tool==='HM'? row.vcHM : row.vcHSS;
    vc = low(base);
  }
  const n = (vc*1000)/(Math.PI*D);
  const fIdx = nearestCol(table.dCols, D);
  const f = row.f[fIdx];
  $('resultBox').innerHTML = `<div class="dro"><div class="droHead">${t('n')} / ${t('vc')}</div><div class="droGrid">
    <div class="droCell"><div class="k">n</div><div class="v">${fmt(n,0)}</div><div class="u">1/min</div></div>
    <div class="droCell"><div class="k">vc</div><div class="v">${fmt(vc,1)}</div><div class="u">m/min</div></div>
    <div class="droCell" style="grid-column:1/3;"><div class="k">f</div><div class="v">${f}</div><div class="u">mm/U (d=${table.dCols[fIdx]}mm)</div></div>
  </div></div>`;
}

/* ---------- GEWINDE ---------- */
function viewGewinde(){
  return `<div class="card">
    <div class="cardTitle">${t('tabs').gewinde} — ${t('regelgewinde')}</div>
    <label>${t('gewindegroesse')} <span class="req">${t('required')}</span></label>
    <select id="mSel">${KERNLOCH_DIN13.map(k=>`<option value="${k.m}">${k.m}</option>`).join('')}</select>

}
function calcGewinde(){

}

/* ---------- PASSUNG ---------- */
let passungSel = { nenn:12, letter:'H', it:7, typ:'bohrung' };
const HOLE_LETTERS = ['H','G','F','E','D','C'];
const SHAFT_LETTERS = ['h','g','f','e','d','c','k','m','n','p','r','s'];
function viewPassung(){
  const isHole = passungSel.typ==='bohrung';
  const letters = isHole? HOLE_LETTERS : SHAFT_LETTERS;
  return `<div class="card">
    <div class="cardTitle">${t('tabs').passung} — Tabellenbuch Metall S.90-92</div>
    <label>${t('typ')} <span class="req">${t('required')}</span></label>
    <div class="segSwitch">
      <button data-typ="bohrung" class="${passungSel.typ==='bohrung'?'active':''}">${t('bohrung')}</button>
      <button data-typ="welle" class="${passungSel.typ==='welle'?'active':''}">${t('welle')}</button>
    </div>
    <label>${t('nennmass')} (mm) <span class="req">${t('required')}</span></label>
    <input type="number" id="nennIn" value="${passungSel.nenn}" min="0.1" step="0.1">
    <div class="row2">
      <div><label>${t('toleranzbuchstabe')} <span class="req">${t('required')}</span></label>
        <select id="letterSel">${letters.map(l=>`<option value="${l}" ${l===passungSel.letter?'selected':''}>${l}</option>`).join('')}</select></div>
      <div><label>${t('itstufe')} <span class="req">${t('required')}</span></label>
        <select id="itSel">${[5,6,7,8,9,10,11].map(g=>`<option value="${g}" ${g==passungSel.it?'selected':''}>IT${g}</option>`).join('')}</select></div>
    </div>
  </div>
  <div id="resultBox"></div>`;
}
function rangeIdxForNenn(n){ const b=[3,6,10,18,30,50,80,120,180,250,315,400,500]; for(let i=0;i<b.length;i++){ if(n<=b[i]) return i; } return -1; }
function grund(isHole, letter, idx, itIdx){
  const IT = GRUNDTOLERANZEN[IT_RANGES[idx]][itIdx-1];
  if(letter==='h'||letter==='H') return isHole? {EI:0,ES:IT} : {ei:-IT,es:0};
  const table = isHole? BOHRUNG_ABMASS : WELLE_ABMASS;
  const arr = table[letter]; if(!arr) return null;
  const dev = arr[idx];
  if(isHole){ return {EI:dev, ES:dev+IT}; }
  if(['c','d','e','f','g'].includes(letter)){ return {es:dev, ei:dev-IT}; }
  return {ei:dev, es:dev+IT};
}
function calcPassung(){
  const n = passungSel.nenn;
  const idx = rangeIdxForNenn(n);
  if(idx<0){ $('resultBox').innerHTML = `<div class="warnBox">${t('outOfRange')}</div>`; return; }
  const isHole = passungSel.typ==='bohrung';
  const res = grund(isHole, passungSel.letter, idx, passungSel.it);
  if(!res){ $('resultBox').innerHTML = `<div class="warnBox">${t('notSupported')}</div>`; return; }
  const lower = isHole? res.EI : res.ei, upper = isHole? res.ES : res.es;
  const dmin = n+lower/1000, dmax = n+upper/1000;
  $('resultBox').innerHTML = `<table class="resultTable">
    <tr><td class="k">${t('nennmass')}</td><td class="v">${n.toFixed(3)} mm</td></tr>
    <tr><td class="k">${t('unteresAbmass')}</td><td class="v">${(lower>=0?'+':'')+lower} µm</td></tr>
    <tr><td class="k">${t('oberesAbmass')}</td><td class="v">${(upper>=0?'+':'')+upper} µm</td></tr>
    <tr><td class="k">${t('mindestmass')}</td><td class="v">${dmin.toFixed(3)} mm</td></tr>
    <tr><td class="k">${t('hoechstmass')}</td><td class="v">${dmax.toFixed(3)} mm</td></tr>
    <tr><td class="k">${t('toleranz')} IT${passungSel.it}</td><td class="v">${upper-lower} µm</td></tr>
  </table>`;
}

/* ---------- INFO ---------- */
function viewInfo(){
  return `<div class="infoCard">
    <div class="cardTitle" style="text-align:center;">${t('infoTitle')}</div>
    <p>${t('infoText')}</p>
    <div class="dev">${t('infoDev')}: Guettouchi Islem</div>
    <p style="margin-top:14px;font-size:11px;">${t('dataSource')}: Tabellenbuch Metall, Europa-Lehrmittel (Europa-Nr. 10609, ISBN 978-3-7585-1471-5) &middot; DIN 13-1 [Internet]</p>
  </div>`;
}

/* ---------- BINDINGS ---------- */
function bindCurrentView(){
  if(state.top==='fraesen'){
    $('matTypeSel').addEventListener('change', e=>{fraesenSel.material=e.target.value; fraesenSel.matIdx=0; render();});
    $('artSel').addEventListener('change', e=>{fraesenSel.art=e.target.value; fraesenSel.matIdx=0; render();});
    $('matSel').addEventListener('change', e=>{fraesenSel.matIdx=+e.target.value; calcFraesen();});
    document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{fraesenSel.mode=b.dataset.mode; render(); calcFraesen();}));
    if($('dIn')) $('dIn').addEventListener('input', e=>{fraesenSel.D=+e.target.value||10; calcFraesen();});
    if($('konturDSel')) $('konturDSel').addEventListener('change', e=>{fraesenSel.konturD=+e.target.value; calcFraesen();});
    $('zIn').addEventListener('input', e=>{fraesenSel.z=+e.target.value||4; calcFraesen();});
    calcFraesen();
  } else if(state.top==='drehen'){
    $('matSel').addEventListener('change', e=>{drehenSel.matIdx=+e.target.value; calcDrehen();});
    $('artSel').addEventListener('change', e=>{drehenSel.art=e.target.value; calcDrehen();});
    document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{drehenSel.tool=b.dataset.tool; drehenSel.matIdx=0; render();}));
    document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{drehenSel.mode=b.dataset.mode; render(); calcDrehen();}));
    $('dIn').addEventListener('input', e=>{drehenSel.D=+e.target.value||30; calcDrehen();});
    calcDrehen();
  } else if(state.top==='bohren'){
    $('matSel').addEventListener('change', e=>{bohrenSel.matIdx=+e.target.value; calcBohren();});
    $('artSel').addEventListener('change', e=>{bohrenSel.art=e.target.value; bohrenSel.matIdx=0; bohrenSel.coating = (e.target.value==='tiefloch'||e.target.value==='kegelsenken')?'unbeschichtet':'beschichtet'; render();});
    document.querySelectorAll('[data-tool]').forEach(b=>b.addEventListener('click',()=>{bohrenSel.tool=b.dataset.tool; render(); calcBohren();}));
    document.querySelectorAll('[data-coating]').forEach(b=>b.addEventListener('click',()=>{bohrenSel.coating=b.dataset.coating; render(); calcBohren();}));
    $('dIn').addEventListener('input', e=>{bohrenSel.D=+e.target.value||10; calcBohren();});
    calcBohren();
  } else if(state.top==='gewinde'){
    $('mSel').addEventListener('change', calcGewinde);
    calcGewinde();
  } else if(state.top==='passung'){
    document.querySelectorAll('[data-typ]').forEach(b=>b.addEventListener('click',()=>{passungSel.typ=b.dataset.typ; passungSel.letter = passungSel.typ==='bohrung'?'H':'h'; render(); calcPassung();}));
    $('nennIn').addEventListener('input', e=>{passungSel.nenn=+e.target.value||0; calcPassung();});
    $('letterSel').addEventListener('change', e=>{passungSel.letter=e.target.value; calcPassung();});
    $('itSel').addEventListener('change', e=>{passungSel.it=+e.target.value; calcPassung();});
    calcPassung();
  }
}

renderShell();
render();
